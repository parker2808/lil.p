name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'graphify-out/**'
      - 'tasks/**'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'graphify-out/**'
      - 'tasks/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TESTED_MERGE_SHA: ${{ github.sha }}

jobs:
  changes:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'packages/ui/**'
              - 'pnpm-lock.yaml'

  lint-typecheck:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm check:all --static

  unit:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @portfolio/contracts... build
      - run: pnpm -r --if-present test
      # V17/V21 unit inventory is produced in parker2808/cms-core after the C3 package switch.
      - name: SchemaForm per-case performance evidence
        run: pnpm --filter @portfolio/web exec vitest run src/modules/admin-core/components/SchemaForm/SchemaForm.test.tsx --reporter=verbose

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css', 'packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - name: Test public bundle guard
        run: node --test scripts/check-public-builder-bytes.test.mjs scripts/check-deployed-public-assets.test.mjs
      - name: Check exact-head public bundle bytes and gzip cap
        run: node scripts/check-public-builder-bytes.mjs
        env:
          PUBLIC_BUNDLE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_BUNDLE_REPORT: ${{ runner.temp }}/public-bundle-report.json
      - name: Attach public route chunk graph
        uses: actions/upload-artifact@v4
        with:
          name: public-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/public-bundle-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Build Storybook (only when packages/ui changes)
        if: needs.changes.outputs.ui == 'true' || github.event_name != 'pull_request'
        run: pnpm --filter @portfolio/ui build-storybook

  vercel-build:
    name: vercel-build
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: node scripts/check-vercel-build.mjs

  api-e2e:
    if: (github.event.action != 'labeled' || github.event.label.name == 'ready-e2e') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: portfolio_test
          MYSQL_USER: app
          MYSQL_PASSWORD: test
        ports:
          - 3307:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=60
    env:
      CMS_RAW_INVENTORY_DIR: ${{ github.workspace }}/cms-raw-inventory
      NODE_ENV: test
      API_PORT: 4001
      API_HOST: 127.0.0.1
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Compose test database and JWT env
        run: |
          user=app
          pass=test
          scheme=mysql
          host=127.0.0.1
          port=3307
          db=portfolio_test
          url="${scheme}://${user}:${pass}@${host}:${port}/${db}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TEST=${url}" >> "$GITHUB_ENV"
          access_a=test-access
          access_b=secret-at-least-32-chars
          refresh_a=test-refresh
          refresh_b=secret-at-least-32-chars
          echo "JWT_ACCESS_SECRET=${access_a}-${access_b}!!" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=${refresh_a}-${refresh_b}!" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - run: pnpm --filter @portfolio/contracts... build
      - run: pnpm --filter @portfolio/api test:e2e
      - name: Upload V17/V21 API inventory
        uses: actions/upload-artifact@v4
        with:
          name: cms-v17-v21-api-${{ env.PR_HEAD_SHA }}-${{ env.TESTED_MERGE_SHA }}
          path: ${{ env.CMS_RAW_INVENTORY_DIR }}/api.json
          if-no-files-found: error

  build-e2e:
    # Builds contracts, api and web once for every web-e2e shard.
    name: web-e2e build
    if: (github.event.action != 'labeled' || github.event.label.name == 'ready-e2e') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
    env:
      NODE_ENV: production
      R3_E2E_STATES: '1'
      API_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://localhost:3000
      WEB_INTERNAL_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css', 'packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter @portfolio/contracts... build
      - run: pnpm --filter @portfolio/api build
        env:
          NODE_ENV: test
      - run: pnpm --filter @portfolio/web build
      # tar keeps the symlinks Turbopack writes to .next/node_modules (upload-artifact drops them).
      - name: Pack build output
        run: >-
          tar -I 'zstd -1 -T0' -cf e2e-build.tar.zst
          --exclude=apps/web/.next/cache --exclude=apps/web/.next/standalone
          packages/contracts/dist apps/api/dist apps/web/.next
      - name: Record build provenance
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_MERGE_SHA"
          printf '{"prHeadSha":"%s","testedMergeSha":"%s"}\n' "$PR_HEAD_SHA" "$TESTED_MERGE_SHA" > e2e-build-provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-build-head-${{ env.PR_HEAD_SHA }}-merge-${{ env.TESTED_MERGE_SHA }}
          path: |
            e2e-build.tar.zst
            e2e-build-provenance.json
          compression-level: 0
          retention-days: 1

  web-e2e-shard:
    # Download only after upload-artifact has finalized in the build job;
    # listing artifacts early does not guarantee download-artifact can read one.
    name: web-e2e shard ${{ matrix.shard }}/8
    needs: build-e2e
    if: (github.event.action != 'labeled' || github.event.label.name == 'ready-e2e') && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NODE_ENV: test
      API_PORT: 4000
      API_HOST: 127.0.0.1
      API_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://localhost:3000
      WEB_INTERNAL_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      E2E_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL (tmpfs, in background)
        # The image pull runs in the background too; "wait for MySQL" below blocks until ready.
        run: |
          nohup docker run -d --name mysql -p 3307:3306 --tmpfs /var/lib/mysql \
            -e MYSQL_ROOT_PASSWORD=test -e MYSQL_DATABASE=portfolio_test \
            -e MYSQL_USER=app -e MYSQL_PASSWORD=test \
            mysql:8.4 --skip-log-bin --innodb-flush-log-at-trx-commit=0 > /tmp/mysql-start.log 2>&1 &
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright browser and deps (in background)
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = true ]; then
            cmd="install-deps chromium"
          else
            cmd="install --with-deps chromium"
          fi
          (cd apps/web && pnpm exec playwright $cmd > /tmp/pw-install.log 2>&1; echo $? > /tmp/pw-install.done) > /dev/null 2>&1 &
      - uses: actions/download-artifact@v4
        with:
          name: e2e-build-head-${{ env.PR_HEAD_SHA }}-merge-${{ env.TESTED_MERGE_SHA }}
          path: .
      - run: tar -I zstd -xf e2e-build.tar.zst
      - name: Verify build provenance
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_MERGE_SHA"
          node -e 'const p = require("./e2e-build-provenance.json"); if (p.prHeadSha !== process.env.PR_HEAD_SHA || p.testedMergeSha !== process.env.TESTED_MERGE_SHA) process.exit(1)'
      - name: Database env and wait for MySQL
        run: |
          user=app
          pass=test
          scheme=mysql
          host=127.0.0.1
          port=3307
          db=portfolio_test
          url="${scheme}://${user}:${pass}@${host}:${port}/${db}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TEST=${url}" >> "$GITHUB_ENV"
          for i in $(seq 1 120); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uapp -ptest --silent 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mysql-start.log; docker logs mysql
          exit 1
      - name: Wait for Playwright install
        run: |
          while [ ! -f /tmp/pw-install.done ]; do sleep 1; done
          cat /tmp/pw-install.log | tail -5
          test "$(cat /tmp/pw-install.done)" = 0
      # CMS theme/tree browser matrices run in parker2808/cms-core after C3.
      - run: pnpm --filter @portfolio/web test:e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}
      - name: Fixture route and WCAG matrix
        if: matrix.shard == 1
        run: |
          pnpm --filter @parker2808/cms-core-fixture build
          pnpm --filter @parker2808/cms-core-fixture test:e2e
      - name: Record shard provenance
        if: always()
        run: |
          mkdir -p apps/web/blob-report
          printf '{"prHeadSha":"%s","testedMergeSha":"%s","shard":%s}\n' "$PR_HEAD_SHA" "$TESTED_MERGE_SHA" '${{ matrix.shard }}' > apps/web/blob-report/provenance-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}-head-${{ env.PR_HEAD_SHA }}-merge-${{ env.TESTED_MERGE_SHA }}
          path: apps/web/blob-report
          retention-days: 1

  web-e2e:
    # Stable check name: green only when the build and every shard passed, or e2e was
    # skipped (PR without the ready-e2e label). Also merges the reports.
    needs: [build-e2e, web-e2e-shard]
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'ready-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: E2E skipped (PR without the ready-e2e label)
        if: needs.web-e2e-shard.result == 'skipped'
        run: echo "web-e2e skipped; add the ready-e2e label to run it."
      - uses: actions/download-artifact@v4
        if: needs.web-e2e-shard.result != 'skipped'
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge shard reports
        if: always() && needs.web-e2e-shard.result != 'skipped' && needs.build-e2e.outputs.playwright != ''
        run: npx -y playwright@${{ needs.build-e2e.outputs.playwright }} merge-reports --reporter html ./all-blob-reports
      - name: Record merged report provenance
        if: always() && needs.web-e2e-shard.result != 'skipped'
        run: |
          mkdir -p playwright-report
          for shard in 1 2 3 4 5 6 7 8; do
            SHARD="$shard" node -e 'const { readFileSync } = require("node:fs"); const shard = process.env.SHARD; const p = JSON.parse(readFileSync(`all-blob-reports/provenance-shard-${shard}.json`)); if (p.shard !== Number(shard) || p.prHeadSha !== process.env.PR_HEAD_SHA || p.testedMergeSha !== process.env.TESTED_MERGE_SHA) process.exit(1)'
          done
          printf '{"prHeadSha":"%s","testedMergeSha":"%s"}\n' "$PR_HEAD_SHA" "$TESTED_MERGE_SHA" > playwright-report/provenance.json
      - uses: actions/upload-artifact@v4
        if: always() && needs.web-e2e-shard.result != 'skipped'
        with:
          name: playwright-report-head-${{ env.PR_HEAD_SHA }}-merge-${{ env.TESTED_MERGE_SHA }}
          path: playwright-report
          retention-days: 7
      - name: Require the build and every shard to pass
        run: |
          build="${{ needs.build-e2e.result }}"
          shards="${{ needs.web-e2e-shard.result }}"
          echo "web-e2e build: $build, shards: $shards"
          { test "$build" = success && test "$shards" = success; } || { test "$build" = skipped && test "$shards" = skipped; }
