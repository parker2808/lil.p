name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:content
      - run: pnpm check:deps
      - run: pnpm build
      - run: pnpm --filter @portfolio/ui build-storybook

  api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: portfolio_test
          MYSQL_USER: app
          MYSQL_PASSWORD: test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      API_PORT: 4001
      API_HOST: 127.0.0.1
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Compose test database and JWT env
        run: |
          user=app
          pass=test
          scheme=mysql
          host=127.0.0.1
          port=3307
          db=portfolio_test
          url="${scheme}://${user}:${pass}@${host}:${port}/${db}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TEST=${url}" >> "$GITHUB_ENV"
          access_a=test-access
          access_b=secret-at-least-32-chars
          refresh_a=test-refresh
          refresh_b=secret-at-least-32-chars
          echo "JWT_ACCESS_SECRET=${access_a}-${access_b}!!" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=${refresh_a}-${refresh_b}!" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - run: pnpm --filter @portfolio/contracts build
      - run: pnpm --filter @portfolio/api test:e2e

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: portfolio_test
          MYSQL_USER: app
          MYSQL_PASSWORD: test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      API_PORT: 4000
      API_HOST: 127.0.0.1
      API_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:3000
      WEB_INTERNAL_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @portfolio/contracts build
      - run: pnpm --filter @portfolio/api build
      - run: pnpm --filter @portfolio/web build
        env:
          NODE_ENV: production
      - run: |
          user=app
          pass=test
          scheme=mysql
          host=127.0.0.1
          port=3307
          db=portfolio_test
          url="${scheme}://${user}:${pass}@${host}:${port}/${db}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TEST=${url}" >> "$GITHUB_ENV"
          export DATABASE_URL="$url"
          pnpm exec prisma migrate deploy
        working-directory: apps/api
      - run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - run: pnpm --filter @portfolio/web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
