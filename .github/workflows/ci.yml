name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'graphify-out/**'
      - 'tasks/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'graphify-out/**'
      - 'tasks/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'packages/ui/**'
              - 'pnpm-lock.yaml'

  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:content
      - run: pnpm check:deps

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @portfolio/contracts build
      - run: pnpm -r --parallel --if-present test

  build:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css', 'packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - name: Build Storybook (only when packages/ui changes)
        if: needs.changes.outputs.ui == 'true' || github.event_name != 'pull_request'
        run: pnpm --filter @portfolio/ui build-storybook

  api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: portfolio_test
          MYSQL_USER: app
          MYSQL_PASSWORD: test
        ports:
          - 3307:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=60
    env:
      NODE_ENV: test
      API_PORT: 4001
      API_HOST: 127.0.0.1
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Compose test database and JWT env
        run: |
          user=app
          pass=test
          scheme=mysql
          host=127.0.0.1
          port=3307
          db=portfolio_test
          url="${scheme}://${user}:${pass}@${host}:${port}/${db}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TEST=${url}" >> "$GITHUB_ENV"
          access_a=test-access
          access_b=secret-at-least-32-chars
          refresh_a=test-refresh
          refresh_b=secret-at-least-32-chars
          echo "JWT_ACCESS_SECRET=${access_a}-${access_b}!!" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=${refresh_a}-${refresh_b}!" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - run: pnpm --filter @portfolio/contracts build
      - run: pnpm --filter @portfolio/api test:e2e

  build-e2e:
    # Builds contracts, api and web once for every web-e2e shard.
    name: web-e2e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
    env:
      NODE_ENV: production
      API_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:3000
      WEB_INTERNAL_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css', 'packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-e2e-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter @portfolio/contracts build
      - run: pnpm --filter @portfolio/api build
        env:
          NODE_ENV: test
      - run: pnpm --filter @portfolio/web build
      # tar keeps the symlinks Turbopack writes to .next/node_modules (upload-artifact drops them).
      - name: Pack build output
        run: >-
          tar -I 'zstd -1 -T0' -cf e2e-build.tar.zst
          --exclude=apps/web/.next/cache --exclude=apps/web/.next/standalone
          packages/contracts/dist apps/api/dist apps/web/.next
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-build
          path: e2e-build.tar.zst
          compression-level: 0
          retention-days: 1

  web-e2e-shard:
    # Starts right away (no `needs`): MySQL, pnpm install and browser deps run
    # while build-e2e builds, then the shard waits for the e2e-build artifact.
    name: web-e2e shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NODE_ENV: test
      API_PORT: 4000
      API_HOST: 127.0.0.1
      API_URL: http://127.0.0.1:4000
      WEB_ORIGIN: http://127.0.0.1:3000
      WEB_INTERNAL_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL (tmpfs, in background)
        # The image pull runs in the background too; "wait for MySQL" below blocks until ready.
        run: |
          nohup docker run -d --name mysql -p 3307:3306 --tmpfs /var/lib/mysql \
            -e MYSQL_ROOT_PASSWORD=test -e MYSQL_DATABASE=portfolio_test \
            -e MYSQL_USER=app -e MYSQL_PASSWORD=test \
            mysql:8.4 --skip-log-bin --innodb-flush-log-at-trx-commit=0 > /tmp/mysql-start.log 2>&1 &
      - uses: ./.github/actions/setup
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright browser and deps (in background)
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = true ]; then
            cmd="install-deps chromium"
          else
            cmd="install --with-deps chromium"
          fi
          (cd apps/web && pnpm exec playwright $cmd > /tmp/pw-install.log 2>&1; echo $? > /tmp/pw-install.done) > /dev/null 2>&1 &
      - name: Wait for the e2e-build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 150); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "e2e-build")] | length')
            [ "$n" = 1 ] && exit 0
            sleep 2
          done
          echo "e2e-build artifact did not appear (did the web-e2e build job fail?)"
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: .
      - run: tar -I zstd -xf e2e-build.tar.zst
      - name: Database env and wait for MySQL
        run: |
          user=app
          pass=test
          scheme=mysql
          host=127.0.0.1
          port=3307
          db=portfolio_test
          url="${scheme}://${user}:${pass}@${host}:${port}/${db}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_TEST=${url}" >> "$GITHUB_ENV"
          for i in $(seq 1 120); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uapp -ptest --silent 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/mysql-start.log; docker logs mysql
          exit 1
      - name: Wait for Playwright install
        run: |
          while [ ! -f /tmp/pw-install.done ]; do sleep 1; done
          cat /tmp/pw-install.log | tail -5
          test "$(cat /tmp/pw-install.done)" = 0
      - run: pnpm --filter @portfolio/web test:e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 1

  web-e2e:
    # Stable check name: green only when the build and every shard passed. Also merges the reports.
    needs: [build-e2e, web-e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge shard reports
        if: always() && needs.build-e2e.outputs.playwright != ''
        run: npx -y playwright@${{ needs.build-e2e.outputs.playwright }} merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Require the build and every shard to pass
        run: test "${{ needs.build-e2e.result }}" = success && test "${{ needs.web-e2e-shard.result }}" = success
