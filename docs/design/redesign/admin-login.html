<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin sign in · redesign mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wdth,wght@0,85..100,100..700;1,85..100,100..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" />
  <link rel="stylesheet" href="redesign.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin admin-login">
  <main class="login" id="main">
    <div class="art">
      <span class="wordmark"><span class="monogram" style="background:#2dd4bf;color:#0f1614">P</span>Portfolio CMS</span>
      <div>
        <p class="display" style="font-size:clamp(40px,5vw,72px);max-width:11ch">Edit the site. <em>Publish</em> when it reads right.</p>
        <p class="meta" style="margin-top:24px;color:color-mix(in oklab,var(--code-fg) 65%,transparent)">Drafts · Preview · Publish per page · Audit log</p>
      </div>
    </div>
    <div class="formside">
      <form onsubmit="return false" class="animate-fade-up">
        <div><h1>Sign in</h1><p class="muted" style="margin-top:6px">Admin workspace</p></div>
        <div class="field"><label for="e">Email</label><input id="e" class="input" type="email" autocomplete="username" placeholder="<email>" /></div>
        <div class="field"><label for="p" style="display:flex;justify-content:space-between">Password <button type="button" class="link" style="border:0;background:none;padding:0;cursor:pointer;font-size:13px">Show</button></label><input id="p" class="input" type="password" autocomplete="current-password" /></div>
        <div class="callout" style="background:var(--del-wash);border-color:color-mix(in oklab,var(--del) 25%,transparent)" role="alert"><b style="color:var(--del)">Error</b><span>Email or password is wrong.</span></div>
        <button class="btn" style="min-height:40px">Sign in</button>
      </form>
    </div>
  </main>
  <script src="mock.js"></script>
</body>
</html>
